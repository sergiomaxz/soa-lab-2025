version: '3.8'

services:
  # --- INFRASTRUCTURE ---
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["15672:15672", "5672:5672"]
    networks: [bike_net]

  keycloak-db:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks: [bike_net]

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8081:8080"]
    depends_on: [keycloak-db]
    networks: [bike_net]

  # --- MICROSERVICES ---
  user_service:
    build: ./user_service
    networks: [bike_net]

  ride_service:
    build: ./ride_service
    depends_on: [rabbitmq, user_service, keycloak]
    networks: [bike_net]

  analytics_service:
    build: ./analytics_service
    depends_on: [rabbitmq]
    networks: [bike_net]

  # --- GATEWAY ---
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80"]
    depends_on: [ride_service, user_service]
    networks: [bike_net]

networks:
  bike_net:
    driver: bridge